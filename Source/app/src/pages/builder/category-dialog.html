<dialog class="editor-dialog" id="category-dialog">
      <div class="dialog-heading">
        <div>
          <p class="section-kicker">تعريف فئة</p>
          <h2 id="category-dialog-title">إضافة فئة</h2>
        </div>
        <button aria-label="إغلاق" class="dialog-close" data-close-dialog="category-dialog" type="button">
          ×
        </button>
      </div>
      <div class="dialog-content">
        <section class="sub-editor configuration-import-editor">
          <div class="sub-editor-heading"><div><h3>استيراد فئة</h3><p>اختر فئة ثم حدد الحقول التي تريد إضافتها كنسخ مستقلة.</p></div><button class="button button-secondary" id="apply-category-import" type="button">إضافة الحقول المحددة</button></div>
          <div class="field-grid compact-grid"><div class="field field-full"><label for="category-import-source">الفئة المصدر</label><select class="control" id="category-import-source"><option value="">اختر فئة</option></select></div></div>
          <div class="configuration-property-grid" id="category-import-fields"></div>
        </section>
        <div class="field-grid compact-grid">
          <div class="field">
            <label for="category-label">اسم الفئة</label>
            <input class="control" id="category-label" type="text">
          </div>
          <div class="field">
            <label for="category-kind">نوع الفئة</label>
            <select class="control" id="category-kind">
              <option value="main">رئيسية — مرة واحدة في السجل</option>
              <option value="repeatable">متكررة — عدة بطاقات</option>
            </select>
          </div>
          <label class="field field-full"><span>هل لها فئة أم؟</span><select class="control" id="category-has-parent"><option value="no">لا</option><option value="yes">نعم</option></select></label>
          <label class="field field-full" id="category-parent-wrapper">
            <span>دمج ضمن فئة أم</span>
            <select class="control" id="category-parent">
              <option value="">بلا فئة أم</option>
            </select>
            <small class="field-help">
              إذا كانت الفئة الأم متكررة، ستظهر هذه الفئة داخل كل بطاقة أم
              وتُحفظ العلاقة بين البطاقات تلقائيًا.
            </small>
          </label>
          <label class="field field-full" hidden id="category-parent-field-wrapper">
            <span>إظهار الفئة تحت حقل من الفئة الأم</span>
            <select class="control" id="category-parent-field"></select>
            <small class="field-help">اختر حقلًا محددًا، أو ضع الفئة في نهاية الفئة الأم.</small>
          </label>
          <label class="field field-full" id="category-placement-wrapper">
            <span>مكان الفئة الجديدة</span>
            <select class="control" id="category-placement"></select>
            <small class="field-help">اختر موضع الفئة بين الفئات الرئيسية؛ يختفي هذا الخيار عند اختيار فئة أم.</small>
          </label>
          <div class="field field-full">
            <label for="category-description">وصف قصير</label>
            <textarea class="control" id="category-description" rows="2"></textarea>
          </div>
          <div class="field-grid field-full compact-grid" hidden="" id="category-repeatable-options">
            <div class="field">
              <label for="category-add-label">نص زر الإضافة</label>
              <input class="control" id="category-add-label" type="text">
            </div>
            <select hidden id="category-anchor"><option value=""></option></select>
            <label class="check-field field-full">
              <input id="category-auto-start" type="checkbox">
              <span>ابدأ ببطاقة فارغة تلقائيًا</span>
            </label>
            <div class="field">
              <label for="category-card-title-field">حقل اسم البطاقة</label>
              <select class="control" id="category-card-title-field"><option value="">بطاقة 1، 2…</option></select>
            </div>
            <div class="field" id="category-card-name-prefix-wrapper">
              <label for="category-card-name-prefix">اسم ثابت للبطاقات</label>
              <input class="control" id="category-card-name-prefix" placeholder="مثال: my_card" type="text">
              <small class="field-help">عند عدم اختيار حقل للاسم تظهر البطاقات: الاسم 1، الاسم 2…</small>
            </div>
            <div class="field">
              <label for="category-card-sort-mode">ترتيب البطاقات</label>
              <select class="control" id="category-card-sort-mode"><option value="manual">يدوي / ترتيب الإدخال</option><option value="title">حسب اسم البطاقة (الأبجدية العربية)</option><option value="field">حسب حقل محدد</option></select>
            </div>
            <div class="field" hidden id="category-card-sort-field-wrapper"><label for="category-card-sort-field">حقل الترتيب</label><select class="control" id="category-card-sort-field"></select></div>
            <div class="field"><label for="category-card-sort-direction">اتجاه الترتيب</label><select class="control" id="category-card-sort-direction"><option value="asc">تصاعدي</option><option value="desc">تنازلي</option></select></div>
            <label class="check-field field-full">
              <input id="category-related-person" type="checkbox">
              <span>تمثل بطاقات هذه الفئة أشخاصًا مرتبطين بسجلات أخرى</span>
            </label>
            <small class="field-help field-full">
              يضيف خانة لإدخال ID الشخص المرتبط، ثم ينسخ الحقول التي تحددها
              في إعداد كل حقل.
            </small>
          </div>
        </div>
        <section class="dialog-subsection condition-editor-section">
          <div class="dialog-section-heading">
            <div>
              <h3>شروط ظهور الفئة</h3>
              <p class="dialog-note">
                تظهر الفئة عندما تتحقق إحدى مجموعات الشروط.
              </p>
            </div>
            <button class="button button-secondary" id="add-category-condition-button" type="button">
              إضافة شرط ظهور
            </button>
          </div>
          <div class="target-conditions-list" id="category-conditions-list"></div>
        </section>
      </div>
      <label class="check-field global-editor-connect-choice" hidden id="global-category-connect-choice"><input id="global-category-connect-active" type="checkbox"><span>ربط التعريف الجديد بالتصميم المفتوح بعد إنشائه</span></label>
      <div class="dialog-actions">
        <button class="button button-primary" id="confirm-category-button" type="button">
          حفظ الفئة
        </button>
        <button class="button button-secondary" data-close-dialog="category-dialog" type="button">
          إلغاء
        </button>
      </div>
    </dialog>
