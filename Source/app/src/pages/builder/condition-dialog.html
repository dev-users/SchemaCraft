<dialog class="editor-dialog" id="condition-dialog">
      <div class="dialog-heading">
        <div>
          <p class="section-kicker">شرط ظهور</p>
          <h2 id="condition-dialog-title">إضافة شرط</h2>
        </div>
        <button aria-label="إغلاق" class="dialog-close" data-close-dialog="condition-dialog" type="button">
          ×
        </button>
      </div>
      <div class="dialog-content">
        <div class="dialog-grid">
          <div class="field field-full">
            <span>العنصر الذي سيتحكم الشرط في ظهوره</span>
            <strong class="condition-target-label" id="condition-target-label"></strong>
          </div>
          <label class="field field-full">
            <span>الحقل المتحكم</span>
            <select class="control" id="condition-source"></select>
          </label>
          <label class="field">
            <span>العملية</span>
            <select class="control" id="condition-operator"></select>
          </label>
          <label class="field">
            <span>مجموعة الشروط</span>
            <select class="control" id="condition-group"></select>
          </label>
          <label class="check-field field-full condition-negate-control">
            <input id="condition-negate" type="checkbox">
            <span>عكس نتيجة هذا الشرط — NOT</span>
          </label>
          <div class="field field-full" id="condition-value-wrapper">
            <span>القيمة</span>
            <div id="condition-value-control"></div>
          </div>
          <p class="dialog-note field-full">
            جميع الشروط داخل المجموعة نفسها مرتبطة بـ AND، والمجموعات المختلفة
            مرتبطة بـ OR.
          </p>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="button button-primary" id="confirm-condition-button" type="button">
          حفظ الشرط
        </button>
        <button class="button button-secondary" data-close-dialog="condition-dialog" type="button">
          إلغاء
        </button>
      </div>
    </dialog>
