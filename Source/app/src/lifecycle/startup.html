<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>تشغيل SchemaCraft</title>
    <link rel="icon" href="assets/schemacraft.ico" type="image/x-icon">
    <link rel="stylesheet" href="lifecycle.css">
    <script defer src="startup.js"></script>
  </head>
  <body>
    <main class="lifecycle-card startup-card" aria-live="polite">
      <img class="lifecycle-logo startup-logo" src="assets/schemacraft.ico" alt="شعار SchemaCraft">
      <form class="login-panel" id="login-panel">
        <label for="startup-user">
          المستخدم الحالي
          <input id="startup-user" list="startup-user-options" maxlength="160" autocomplete="off" required>
          <datalist id="startup-user-options"></datalist>
        </label>
        <button class="primary-action" disabled id="startup-continue" type="submit">جاري تجهيز مساحة العمل…</button>
      </form>

      <p class="lifecycle-error" id="startup-error" role="alert" hidden></p>
    </main>
  </body>
</html>
