<dialog class="editor-dialog appearance-condition-dialog" id="condition-dialog" aria-labelledby="condition-dialog-title">
  <div class="dialog-heading appearance-condition-heading">
    <h2 id="condition-dialog-title">إضافة شرط ظهور</h2>
    <div class="appearance-heading-controls">
      <label class="check-field appearance-compare-toggle">
        <input id="condition-compare-enabled" type="checkbox">
        <span>مقارنة مع قيمة حقل آخر</span>
      </label>
      <label class="field appearance-group-control">
        <span>مجموعة الشروط</span>
        <select class="control" id="condition-group" aria-describedby="condition-group-help"></select>
      </label>
    </div>
  </div>
  <div class="dialog-content">
    <div class="appearance-condition-row">
      <label class="field">
        <span>الحقل المتحكم</span>
        <select class="control" id="condition-source"></select>
      </label>
      <label class="field">
        <span>العملية</span>
        <select class="control" id="condition-operator"></select>
      </label>
      <div class="field" id="condition-value-wrapper">
        <span id="condition-value-label">القيمة</span>
        <div id="condition-value-control"></div>
      </div>
    </div>
    <p class="dialog-note" id="condition-group-help">جميع الشروط داخل المجموعة نفسها مرتبطة بـ AND، والمجموعات المختلفة مرتبطة بـ OR.</p>
  </div>
  <div class="dialog-actions">
    <button class="button button-primary" id="confirm-condition-button" type="button">حفظ الشرط</button>
    <button class="button button-secondary" data-close-dialog="condition-dialog" type="button">إلغاء</button>
  </div>
</dialog>
