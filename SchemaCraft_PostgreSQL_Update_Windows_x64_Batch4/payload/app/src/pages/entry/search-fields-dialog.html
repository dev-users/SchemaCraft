<dialog class="editor-dialog editor-dialog-wide selection-tree-dialog" id="search-fields-dialog">
      <div class="dialog-heading">
        <div>
          <p class="section-kicker">بحث مؤقت</p>
          <h2>اختيار حقول البحث</h2>
          <p class="muted-text">هذا الاختيار يخص جلسة التشغيل الحالية ولا يغيّر الإعداد الافتراضي.</p>
        </div>
        <button aria-label="إغلاق" class="dialog-close" data-close-dialog="search-fields-dialog" type="button">
          ×
        </button>
      </div>
      <div class="dialog-content">
        <div class="selection-dialog-toolbar search-field-picker-tools">
          <strong>الفئات والحقول</strong>
          <div class="compact-option-actions">
            <button class="button button-quiet" id="select-all-search-fields-button" type="button">تحديد الكل</button>
            <button class="button button-quiet" id="clear-all-search-fields-button" type="button">إلغاء الكل</button>
          </div>
        </div>
        <div class="search-field-options" id="search-field-options"></div>
      </div>
      <div class="dialog-actions">
        <button class="button button-primary" id="apply-search-fields-button" type="button">
          تطبيق لهذه الجلسة
        </button>
        <button class="button button-secondary" id="reset-search-fields-button" type="button">
          العودة إلى الافتراضية
        </button>
        <button class="button button-secondary" data-close-dialog="search-fields-dialog" type="button">
          إلغاء
        </button>
      </div>
    </dialog>
