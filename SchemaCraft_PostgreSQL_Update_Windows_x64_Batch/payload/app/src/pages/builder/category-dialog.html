<dialog aria-labelledby="category-dialog-title" class="editor-dialog editor-dialog-wide compact-builder-dialog" id="category-dialog">
<div class="dialog-heading">
<div>
<p class="section-kicker">تعريف فئة</p>
<h2 id="category-dialog-title">إضافة فئة</h2>
</div>
<button aria-label="إغلاق" class="dialog-close" data-close-dialog="category-dialog" type="button">
          ×
        </button>
</div>
<div class="dialog-content"><section class="dialog-subsection compact-config-panel" id="category-basic-panel"><div class="dialog-section-heading"><h3>معلومات الفئة الأساسية</h3><div class="compact-heading-actions"><button class="button button-secondary" data-compact-open="compact-category-import" type="button">استيراد فئة</button><button class="button button-secondary" data-compact-open="compact-category-type" id="compact-category-type-button" type="button">إعدادات خاصة بالنوع</button></div></div><div class="compact-settings-grid" id="category-basic-panel-body"><div class="field">
<label for="category-label">اسم الفئة</label>
<input class="control" id="category-label" type="text"/>
</div><div class="field">
<label for="category-kind">نوع الفئة</label>
<select class="control" id="category-kind">
<option value="main">رئيسية — مرة واحدة في السجل</option>
<option value="repeatable">متكررة — عدة بطاقات</option>
<option value="view_table">جدول عرض — قراءة فقط من جداول مصدر</option>
</select>
</div><label class="field field-full"><span>هل لها فئة أم؟</span><select class="control" id="category-has-parent"><option value="no">لا</option><option value="yes">نعم</option></select></label><label class="field field-full" id="category-placement-wrapper">
<span>مكان الفئة الجديدة</span>
<select class="control" id="category-placement"></select>
</label><label class="field field-full" id="category-parent-wrapper">
<span>دمج ضمن فئة أم</span>
<select class="control" id="category-parent">
<option value="">بلا فئة أم</option>
</select>
</label><div class="compact-reserved-field-slot" id="compact-category-parent-field-slot"><label class="field field-full" hidden="" id="category-parent-field-wrapper">
<span>إظهار الفئة تحت حقل من الفئة الأم</span>
<select class="control" id="category-parent-field"></select>
<small class="field-help">اختر حقلًا محددًا، أو ضع الفئة في نهاية الفئة الأم.</small>
</label></div><div class="compact-flag-row" id="compact-category-language-row"><label class="check-field"><input data-compact-gate="category-language" id="compact-category-language-enabled" type="checkbox"/><span>استخدام نصوص مختلفة للعربية والفارسية</span></label><button aria-label="استخدام نصوص مختلفة للعربية والفارسية" class="button button-secondary workflow-icon-only" data-compact-edit="category-language" title="استخدام نصوص مختلفة للعربية والفارسية" type="button"><svg aria-hidden="true" class="action-icon"><use href="#icon-settings"></use></svg></button></div><div class="field field-full compact-description-row compact-span-all">
<label for="category-description">وصف قصير</label>
<textarea class="control" id="category-description" rows="1"></textarea>
</div></div></section><section class="dialog-subsection condition-editor-section appearance-owner-panel" id="category-appearance-panel">
  <div class="dialog-section-heading">
    <h3>شروط ظهور الفئة</h3>
    <button class="button button-secondary" id="add-category-condition-button" type="button">إضافة شرط ظهور</button>
  </div>
  <div class="target-conditions-list" id="category-conditions-list"></div>
</section></div>
<label class="check-field global-editor-connect-choice" hidden="" id="global-category-connect-choice"><input id="global-category-connect-active" type="checkbox"/><span>ربط التعريف الجديد بالتصميم المفتوح بعد إنشائه</span></label>
<div class="dialog-actions">
<button class="button button-primary" id="confirm-category-button" type="button">
          حفظ الفئة
        </button>
<button class="button button-secondary" data-close-dialog="category-dialog" type="button">
          إلغاء
        </button>
</div>
<dialog class="editor-dialog editor-dialog-wide compact-detail-dialog" id="compact-category-import">
<div class="dialog-heading"><h2 id="compact-category-import-title">استيراد فئة</h2><button aria-label="إغلاق" class="dialog-close" data-compact-cancel="compact-category-import" type="button">×</button></div>
<div class="dialog-content compact-detail-content" id="compact-category-import-content"><section class="sub-editor configuration-import-editor">
<div class="sub-editor-heading"><div><h3>استيراد فئة</h3><p>اختر فئة ثم حدد الحقول التي تريد إضافتها كنسخ مستقلة.</p></div><button class="button button-secondary" id="apply-category-import" type="button">إضافة الحقول المحددة</button></div>
<div class="field-grid compact-grid"><div class="field field-full"><label for="category-import-source">الفئة المصدر</label><select class="control" id="category-import-source"><option value="">اختر فئة</option></select></div></div>
<div class="configuration-property-grid" id="category-import-fields"></div>
</section></div>
<div class="dialog-actions"><button class="button button-primary" data-compact-apply="compact-category-import" type="button">حفظ الإعدادات</button><button class="button button-secondary" data-compact-cancel="compact-category-import" type="button">إلغاء</button></div>
</dialog><dialog class="editor-dialog editor-dialog-wide compact-detail-dialog" id="compact-category-type">
<div class="dialog-heading"><h2 id="compact-category-type-title">إعدادات خاصة بالنوع</h2><button aria-label="إغلاق" class="dialog-close" data-compact-cancel="compact-category-type" type="button">×</button></div>
<div class="dialog-content compact-detail-content" id="compact-category-type-content"><div class="field-grid field-full compact-grid" hidden="" id="category-repeatable-options">
<div class="field">
<label for="category-add-label">نص زر الإضافة</label>
<input class="control" id="category-add-label" type="text"/>
</div>
<select hidden="" id="category-anchor"><option value=""></option></select>
<label class="check-field">
<input id="category-auto-start" type="checkbox"/>
<span>ابدأ ببطاقة فارغة تلقائيًا</span>
</label>
<div class="field">
<label for="category-card-title-field">حقل اسم البطاقة</label>
<select class="control" id="category-card-title-field"><option value="">بطاقة 1، 2…</option></select>
</div>
<div class="field" id="category-card-name-prefix-wrapper">
<label for="category-card-name-prefix">اسم ثابت للبطاقات</label>
<input class="control" id="category-card-name-prefix" placeholder="مثال: my_card" type="text"/>
</div>
<div class="compact-repeatable-sort-row"><div class="field">
<label for="category-card-sort-mode">ترتيب البطاقات</label>
<select class="control" id="category-card-sort-mode"><option value="manual">يدوي / ترتيب الإدخال</option><option value="title">حسب اسم البطاقة (الأبجدية العربية)</option><option value="field">حسب حقل محدد</option></select>
</div>
<div class="field" hidden="" id="category-card-sort-field-wrapper"><label for="category-card-sort-field">حقل الترتيب</label><select class="control" id="category-card-sort-field"></select></div>
</div><div class="compact-repeatable-display" id="compact-repeatable-display"></div><div class="field"><label for="category-card-sort-direction">اتجاه الترتيب</label><select class="control" id="category-card-sort-direction"><option value="asc">تصاعدي</option><option value="desc">تنازلي</option></select></div>
<!-- Read-only legacy round-trip state, not another configuration
                 surface. Do not erase old related-person data when saving an
                 unrelated category edit. New matching lives on its source field. -->
<input id="category-related-person" type="checkbox" hidden disabled aria-hidden="true" tabindex="-1">
</div><div class="finance-definition-editor" id="finance-category-editor"></div><section class="dialog-subsection definition-alerts-panel" id="category-alerts-panel">
<div class="dialog-section-heading"><h3>التنبيهات</h3><button class="button button-secondary" id="category-add-alert" type="button">إضافة تنبيه</button></div>
<div class="alert-rule-list" id="category-alerts-list"></div>
</section></div>
<div class="dialog-actions"><button class="button button-primary" data-compact-apply="compact-category-type" type="button">حفظ الإعدادات</button><button class="button button-secondary" data-compact-cancel="compact-category-type" type="button">إلغاء</button></div>
</dialog><dialog class="editor-dialog editor-dialog-wide compact-detail-dialog" id="compact-category-language">
<div class="dialog-heading"><h2 id="compact-category-language-title">استخدام نصوص مختلفة للعربية والفارسية</h2><button aria-label="إغلاق" class="dialog-close" data-compact-cancel="compact-category-language" type="button">×</button></div>
<div class="dialog-content compact-detail-content" id="compact-category-language-content"><div class="localized-name-slot" id="category-language-editor"></div></div>
<div class="dialog-actions"><button class="button button-primary" data-compact-apply="compact-category-language" type="button">حفظ الإعدادات</button><button class="button button-secondary" data-compact-cancel="compact-category-language" type="button">إلغاء</button></div>
</dialog></dialog>
